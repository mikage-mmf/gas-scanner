<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>図書バーコードスキャナー (Camera Scanner)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- html5-qrcode (フォールバック付き) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      gap: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    .badge-target {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 9999px;
      transition: all 0.2s;
    }

    .badge-target.step-book {
      color: #4ade80;
      border-color: #16a34a;
      background: #064e3b;
    }

    /* カメラ枠ラッパー */
    .scanner-wrapper {
      flex: 1;
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      position: relative;
    }

    .scanner-container {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 0 0 3px #334155, 0 16px 40px rgba(0, 0, 0, 0.6);
      transition: box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scanner-container.success-flash {
      box-shadow: 0 0 0 4px #22c55e, 0 0 40px 10px rgba(34, 197, 94, 0.7);
    }

    #reader-preview {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    #reader-preview video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      border-radius: 16px;
    }

    /* ガイド枠（中央ターゲット） */
    .scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75%;
      max-width: 300px;
      height: 45%;
      max-height: 180px;
      border: 2px dashed rgba(255, 255, 255, 0.65);
      border-radius: 12px;
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }

    /* レーザー走査線 */
    .scan-laser {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, #0284c7, #38bdf8, transparent);
      box-shadow: 0 0 10px 2px rgba(56, 189, 248, 0.7);
      animation: scanLaser 2s infinite ease-in-out;
      pointer-events: none;
      z-index: 6;
    }

    @keyframes scanLaser {
      0% { top: 15%; opacity: 0.2; }
      50% { top: 85%; opacity: 1; }
      100% { top: 15%; opacity: 0.2; }
    }

    /* スキャン成功オーバーレイ */
    .success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(34, 197, 94, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 10;
      backdrop-filter: blur(2px);
    }

    .success-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .success-icon {
      font-size: 3.8rem;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    .success-code {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-top: 6px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    .btn-return-host {
      background: #38bdf8 !important;
      color: #0f172a !important;
      font-weight: 700 !important;
      font-size: 0.95rem !important;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4) !important;
      border: none !important;
    }

    /* 下部ステータス & コントロール */
    .control-panel {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    #status-area {
      width: 100%;
      min-height: 52px;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      line-height: 1.4;
    }

    #status-area.ready   { color: #cbd5e1; }
    #status-area.step    { color: #38bdf8; background: #082f49; border-color: #0284c7; }
    #status-area.success { color: #22c55e; background: #052e16; border-color: #22c55e; }
    #status-area.error   { color: #ef4444; background: #450a0a; border-color: #ef4444; }

    /* 1冊終了ボタン（目立つアクション） */
    #btn-finish-checkout {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      border: 1px solid #34d399;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: none; /* 初期は非表示 */
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: all 0.15s;
      animation: pulseButton 2.2s infinite ease-in-out;
    }

    #btn-finish-checkout:active {
      transform: scale(0.98);
      background: #047857;
    }

    @keyframes pulseButton {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn:active {
      transform: scale(0.98);
      background: #334155;
    }

    .btn-close {
      background: #334155;
      color: #f8fafc;
    }

    /* 単体実行時の結果表示カード */
    #manual-result-card {
      display: none;
      margin-top: 6px;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <span>📷</span>
      <h1>バーコードスキャナー</h1>
    </div>
    <div id="target-badge" class="badge-target">スキャン準備中</div>
  </header>

  <!-- カメラプレビュー -->
  <div class="scanner-wrapper">
    <div id="scanner-box" class="scanner-container">
      <div id="reader-preview"></div>
      <div class="scan-guide">
        <div class="scan-laser"></div>
      </div>
      <div id="success-overlay" class="success-overlay">
        <span class="success-icon">✅</span>
        <div id="success-code-display" class="success-code"></div>
        <button id="btn-return-host" class="btn btn-return-host" type="button" style="margin-top: 14px; width: 85%; max-width: 260px; height: 44px; display: none;">
          ↩️ タブを閉じて戻る
        </button>
      </div>
    </div>
  </div>

  <!-- 操作部 -->
  <div class="control-panel">
    <div id="status-area" class="ready">カメラを起動しています...</div>
    
    <!-- 1冊で終了ボタン（セッション連動スキャン時に出現） -->
    <button id="btn-finish-checkout" type="button">
      <span>🟢</span> この1冊で貸出を終了する
    </button>

    <div id="manual-result-card">
      <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 2px;">読み取り結果:</div>
      <div id="manual-code" style="font-size: 1.15rem; font-weight: 700; color: #38bdf8;">-</div>
      <button id="btn-copy" class="btn" style="margin-top: 6px; height: 34px; font-size: 0.8rem;">📋 クリップボードにコピー</button>
    </div>

    <div class="btn-group">
      <button id="btn-switch-cam" class="btn">🔄 カメラ切替</button>
      <button id="btn-cancel" class="btn btn-close">✖ 閉じる</button>
    </div>
  </div>

  <script>
    // URLパラメータの取得
    const params = new URLSearchParams(window.location.search);
    let currentTargetInputId = params.get('target') || '';
    const scanMode = params.get('mode') || 'single'; // 'single' | 'continuous' | 'checkout-flow'
    let currentTargetLabel = params.get('label') || 'バーコード';

    // バッジ & UI
    const badgeEl = document.getElementById('target-badge');
    const statusArea = document.getElementById('status-area');
    const scannerBox = document.getElementById('scanner-box');
    const successOverlay = document.getElementById('success-overlay');
    const successCodeDisplay = document.getElementById('success-code-display');
    const btnFinishCheckout = document.getElementById('btn-finish-checkout');

    function updateBadge(label, isStepBook = false) {
      badgeEl.textContent = label;
      if (isStepBook) {
        badgeEl.classList.add('step-book');
      } else {
        badgeEl.classList.remove('step-book');
      }
    }
    updateBadge(currentTargetLabel);

    // 効果音 (Web Audio API)
    let audioCtx = null;
    function playBeep(freq = 1760, duration = 0.12) {
      try {
        if (!audioCtx) {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioCtxClass();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let html5QrCode = null;
    let isScanning = false;
    let isCooldown = false;
    let currentFacingMode = "environment";

    function setStatus(type, msg) {
      statusArea.className = type;
      statusArea.textContent = msg;
    }

    async function startCamera(facing = "environment") {
      if (typeof Html5Qrcode === 'undefined') {
        setStatus('error', 'カメラライブラリの読込に失敗しました');
        return;
      }

      if (html5QrCode) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
      }

      html5QrCode = new Html5Qrcode("reader-preview");
      const config = {
        fps: 12,
        qrbox: { width: 280, height: 150 },
        aspectRatio: 1.333333
      };

      try {
        await html5QrCode.start(
          { facingMode: facing },
          config,
          onCodeScanned,
          () => {}
        );
        isScanning = true;
        isCooldown = false;
        setStatus('ready', `${currentTargetLabel}を枠に合わせてください`);
      } catch (err) {
        console.error("Camera start error:", err);
        setStatus('error', 'カメラの起動に失敗しました。カメラ権限を確認してください。');
      }
    }

    /**
     * スキャン認識時ハンドラ
     */
    function onCodeScanned(decodedText) {
      if (!isScanning || isCooldown) return;
      const code = decodedText.trim();
      if (!code) return;

      isScanning = false;
      isCooldown = true;

      playBeep();
      scannerBox.classList.add('success-flash');
      successCodeDisplay.textContent = code;
      successOverlay.classList.add('visible');
      setStatus('success', `読取成功: ${code}`);

      // 親ウィンドウ（GAS本体）へ送信
      let messageSent = false;
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'LIBRARY_SCAN_RESULT',
            code: code,
            target: currentTargetInputId
          }, '*');
          messageSent = true;
          console.log('[Scanner] Sent to opener:', code, currentTargetInputId);
        } catch (e) {
          console.warn('[Scanner] postMessage error:', e);
        }
      }

      // opener不在の単体利用フォールバック
      if (!messageSent) {
        document.getElementById('manual-result-card').style.display = 'block';
        document.getElementById('manual-code').textContent = code;
        document.getElementById('btn-copy').onclick = () => {
          navigator.clipboard.writeText(code).then(() => alert('コピーしました: ' + code));
        };
      }

      // モードに応じた挙動
      if (scanMode === 'single' && messageSent) {
        // 単発モード: 即終了を試みつつ、スマホで自動クローズがブロックされた場合に備えて復帰ボタンを表示
        const btnReturn = document.getElementById('btn-return-host');
        if (btnReturn) btnReturn.style.display = 'flex';
        setTimeout(() => window.close(), 550);
      } else if (scanMode === 'checkout-flow' && messageSent) {
        // 連続貸出フローモード: 親からの状態通知（UPDATE_SCANNER_STEP）を待つ
        setTimeout(() => {
          scannerBox.classList.remove('success-flash');
          successOverlay.classList.remove('visible');
          // クールダウン解除し、次の読み取りに備える
          isCooldown = false;
          isScanning = true;
        }, 1200);
      } else {
        // 返却等の連続スキャンモード: 1.8秒後に待機復帰
        setTimeout(() => {
          scannerBox.classList.remove('success-flash');
          successOverlay.classList.remove('visible');
          isCooldown = false;
          isScanning = true;
          setStatus('ready', `${currentTargetLabel}を枠に合わせてください`);
        }, 1800);
      }
    }

    /**
     * 親ウィンドウ（GAS本体）からの状態更新を受信
     * 個人情報（名前など）は含まれず、ステータス記号と残り冊数のみ
     */
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      const data = event.data;

      if (data.type === 'UPDATE_SCANNER_STEP') {
        const step = data.step; // 'BOOK_CHECKOUT' | 'COMPLETE'
        const remaining = data.remaining; // 0, 1, 2
        const target = data.target || 'input-book-id';

        currentTargetInputId = target;

        if (step === 'BOOK_CHECKOUT') {
          // 本スキャン待機状態へ更新
          updateBadge(`本のシール (あと${remaining}冊)`, true);
          
          if (remaining > 1) {
            // まだ2冊借りられる場合
            setStatus('step', `✅ 利用者確認済（あと${remaining}冊）：本のシールをかざしてください`);
            btnFinishCheckout.style.display = 'none';
          } else if (remaining === 1) {
            // 残り1冊（1冊読んだ後、または元々残り1冊だった場合）
            setStatus('step', `✅ 1冊目を登録しました（あと1冊可能）：2冊目をかざすか、下のボタンで終了できます`);
            btnFinishCheckout.style.display = 'flex'; // 1冊終了ボタンを表示！
          }
        } else if (step === 'COMPLETE') {
          // 上限達成等で貸出完了
          playBeep(2200, 0.2);
          btnFinishCheckout.style.display = 'none';
          setStatus('success', '✅ 貸出を完了しました！');
          setTimeout(() => {
            window.close();
          }, 800);
        }
      } else if (data.type === 'SCANNER_ERROR') {
        // 貸出不可・エラー時
        setStatus('error', data.message || 'エラーが発生しました');
        btnFinishCheckout.style.display = 'none';
      }
    });

    // 「この1冊で貸出を終了する」ボタン
    btnFinishCheckout.addEventListener('click', () => {
      playBeep(1960, 0.15);
      setStatus('success', '✅ 1冊で貸出を完了します...');
      btnFinishCheckout.disabled = true;

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'FINISH_CHECKOUT_SESSION'
          }, '*');
        } catch (e) {}
      }

      setTimeout(() => {
        window.close();
      }, 500);
    });

    // カメラ切替
    document.getElementById('btn-switch-cam').addEventListener('click', async () => {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      await startCamera(currentFacingMode);
    });

    // 復帰ボタン（スマホでタブが自動で閉じなかった時の手動復帰）
    document.getElementById('btn-return-host')?.addEventListener('click', () => {
      window.close();
    });

    // 閉じる（やめる・キャンセル）
    document.getElementById('btn-cancel').addEventListener('click', () => {
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'CANCEL_SCANNER',
            mode: scanMode,
            target: currentTargetInputId
          }, '*');
        } catch (e) {}
      }
      window.close();
    });

    // 起動
    window.addEventListener('DOMContentLoaded', () => {
      startCamera(currentFacingMode);
    });
  </script>
</body>
</html>
