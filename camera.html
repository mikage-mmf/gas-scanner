<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>図書バーコードスキャナー (Camera Scanner)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- html5-qrcode CDN (フォールバック削除) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      gap: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    .badge-target {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 9999px;
      transition: all 0.2s;
    }

    .badge-target.step-book {
      color: #4ade80;
      border-color: #16a34a;
      background: #064e3b;
    }

    /* カメラ枠ラッパー */
    .scanner-wrapper {
      flex: 1;
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      position: relative;
    }

    .scanner-container {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 0 0 3px #334155, 0 16px 40px rgba(0, 0, 0, 0.6);
      transition: box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scanner-container.success-flash {
      box-shadow: 0 0 0 4px #22c55e, 0 0 40px 10px rgba(34, 197, 94, 0.7);
    }

    #reader-preview {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    #reader-preview video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      border-radius: 16px;
    }

    /* ガイド枠（中央ターゲット） */
    .scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75%;
      max-width: 300px;
      height: 45%;
      max-height: 180px;
      border: 2px dashed rgba(255, 255, 255, 0.65);
      border-radius: 12px;
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }

    /* レーザー走査線 */
    .scan-laser {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, #0284c7, #38bdf8, transparent);
      box-shadow: 0 0 10px 2px rgba(56, 189, 248, 0.7);
      animation: scanLaser 2s infinite ease-in-out;
      pointer-events: none;
      z-index: 6;
    }

    @keyframes scanLaser {
      0% { top: 15%; opacity: 0.2; }
      50% { top: 85%; opacity: 1; }
      100% { top: 15%; opacity: 0.2; }
    }

    /* スキャン成功オーバーレイ */
    .success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(34, 197, 94, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 10;
      backdrop-filter: blur(2px);
    }

    .success-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .success-icon {
      font-size: 3.8rem;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    .success-code {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-top: 6px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    .btn-return-host {
      background: #38bdf8 !important;
      color: #0f172a !important;
      font-weight: 700 !important;
      font-size: 0.95rem !important;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4) !important;
      border: none !important;
    }

    /* 下部ステータス & コントロール */
    .control-panel {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    #status-area {
      width: 100%;
      min-height: 52px;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      line-height: 1.4;
    }

    #status-area.ready   { color: #cbd5e1; }
    #status-area.step    { color: #38bdf8; background: #082f49; border-color: #0284c7; }
    #status-area.success { color: #22c55e; background: #052e16; border-color: #22c55e; }
    #status-area.error   { color: #ef4444; background: #450a0a; border-color: #ef4444; }

    /* 1冊終了ボタン（目立つアクション） */
    #btn-finish-checkout {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      border: 1px solid #34d399;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: none; /* 初期は非表示 */
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: all 0.15s;
      animation: pulseButton 2.2s infinite ease-in-out;
    }

    #btn-finish-checkout:active {
      transform: scale(0.98);
      background: #047857;
    }

    @keyframes pulseButton {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn:active {
      transform: scale(0.98);
      background: #334155;
    }

    .btn-close {
      background: #334155;
      color: #f8fafc;
    }

    /* 単体実行時の結果表示カード */
    #manual-result-card {
      display: none;
      margin-top: 6px;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <span>📷</span>
      <h1 id="scanner-title">バーコードスキャナー</h1>
    </div>
    <div id="target-badge" class="badge-target">スキャン準備中</div>
  </header>

  <!-- カメラプレビュー -->
  <div class="scanner-wrapper">
    <div id="scanner-box" class="scanner-container">
      <div id="reader-preview"></div>
      <div class="scan-guide">
        <div class="scan-laser"></div>
      </div>
      <div id="success-overlay" class="success-overlay">
        <span class="success-icon">✅</span>
        <div id="success-code-display" class="success-code"></div>
        <button id="btn-return-host" class="btn btn-return-host" type="button" style="margin-top: 14px; width: 85%; max-width: 260px; height: 44px; display: none;">
          <span id="btn-return-host-text">↩️ タブを閉じて戻る</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 操作部 -->
  <div class="control-panel">
    <div id="status-area" class="ready">カメラを起動しています...</div>
    
    <!-- 1冊で終了ボタン（セッション連動スキャン時に出現） -->
    <button id="btn-finish-checkout" type="button">
      <span>🟢</span> <span id="btn-finish-checkout-text">この1冊で貸出を終了する</span>
    </button>

    <div id="manual-result-card">
      <div id="lbl-scan-result" style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 2px;">読み取り結果:</div>
      <div id="manual-code" style="font-size: 1.15rem; font-weight: 700; color: #38bdf8;">-</div>
      <button id="btn-copy" class="btn" style="margin-top: 6px; height: 34px; font-size: 0.8rem;"><span id="btn-copy-text">📋 クリップボードにコピー</span></button>
    </div>

    <div class="btn-group">
      <button id="btn-switch-cam" class="btn"><span id="btn-switch-cam-text">🔄 カメラ切替</span></button>
      <button id="btn-cancel" class="btn btn-close"><span id="btn-cancel-text">✖ 閉じる</span></button>
    </div>
  </div>

  <script>
    // 🌐 多言語辞書 (7言語完全対応)

        checkoutDone: '✅ 借书手续已完成！',
        badgeRemaining: '图书标签 (剩余{count}本)'
      },
      ko: {
        title: '바코드 스캐너',
        ready: '카메라를 시작하는 중...',
        guide: '{label}을(를) 프레임에 맞춰주세요',

        btnSwitchCam: '🔄 카메라 전환',

        errLib: '카메라 라이브러리를 로드하지 못했습니다',
        errStart: '카메라를 시작하지 못했습니다. 카메라 권한을 확인해 주세요.',
        errWrongCode192: '⚠️ 하단 분류코드(192)입니다. 상단 바코드(978...)를 스캔해 주세요',
        stepRemaining: '✅ 이용자 확인 완료 (남은 대출: {count}권): 도서 라벨을 스캔해 주세요',
        stepOneDone: '✅ 1권 등록 완료 (1권 더 가능): 2번째 도서를 스캔하거나 아래 버튼을 누르세요',

        btnCopy: '📋 Copiar para Área de Transferência',
        copied: 'Copiado: ',
        scanResult: 'Resultado da Leitura:',
        errLib: 'Falha ao carregar biblioteca da câmera',
        errStart: 'Falha ao iniciar a câmera. Verifique as permissões.',
        errWrongCode192: '⚠️ Código inferior (192). Aponte para o código superior (978...)',
        stepRemaining: '✅ Usuário verificado ({count} livro(s) restante(s)): Escaneie a etiqueta',
        stepOneDone: '✅ 1º livro registrado (mais 1 permitido): Escaneie o 2º ou finalize abaixo',
        checkoutDone: '✅ Empréstimo concluído!',
        badgeRemaining: 'Etiqueta do Livro ({count} restante(s))'
      },
      vi: {
        title: 'Máy quét mã vạch',
        ready: 'Đang khởi động camera...',
        guide: 'Căn chỉnh {label} vào khung hình',
        success: 'Quét thành công: {code}',
        btnSwitchCam: '🔄 Đổi Camera',
        btnClose: '✖ Đóng',
        btnFinishSingle: 'Hoàn tất với cuốn sách này',
        btnReturn: '↩️ Đóng tab và quay lại',
        btnCopy: '📋 Sao chép vào bộ nhớ tạm',
        copied: 'Đã sao chép: ',
        scanResult: 'Kết quả quét:',
        errLib: 'Không thể tải thư viện camera',
        errStart: 'Không thể khởi động camera. Vui lòng kiểm tra quyền truy cập.',
        errWrongCode192: '⚠️ Mã phân loại dưới (192). Vui lòng quét mã vạch trên (978...)',
        stepRemaining: '✅ Đã xác nhận bạn đọc (còn {count} cuốn): Quét nhãn sách',

        checkoutDone: '✅ Đã hoàn tất mượn sách!',
        badgeRemaining: 'Nhãn sách (còn {count} cuốn)'
      },
      tl: {
        title: 'Barcode Scanner',
        ready: 'Sinisimulan ang camera...',
        guide: 'Itapat ang {label} sa loob ng kahon',
        success: 'Matagumpay na na-scan: {code}',
        btnSwitchCam: '🔄 Palitan ang Camera',
        btnClose: '✖ Isara',
        btnFinishSingle: 'Tapusin sa aklat na ito',
        btnReturn: '↩️ Isara ang tab at bumalik',
        btnCopy: '📋 Kopyahin sa Clipboard',
        copied: 'Kinopya: ',
        scanResult: 'Resulta ng Scan:',
        errLib: 'Bigo sa pag-load ng camera library',
        errStart: 'Hindi masimulan ang camera. Pakisuri ang mga pahintulot ng camera.',
        errWrongCode192: '⚠️ Pang-ibabang barcode (192). Itapat sa itaas na barcode (978...)',
        stepRemaining: '✅ Kumpirmado ang patron ({count} aklat pa): I-scan ang sticker ng aklat',
        stepOneDone: '✅ Rehistrado na ang ika-1 aklat (pwede pa ang 1): I-scan ang ika-2 o tapusin sa ibaba',
        checkoutDone: '✅ Tapos na ang paghiram!',
        badgeRemaining: 'Sticker ng Aklat ({count} natitira)'
      }
    };

    // URLパラメータの取得
    const params = new URLSearchParams(window.location.search);
    let currentTargetInputId = params.get('target') || '';
    const scanMode = params.get('mode') || 'single';
    let currentTargetLabel = params.get('label') || 'バーコード';
    let rawLang = params.get('lang') || 'ja';
    if (rawLang.startsWith('zh')) rawLang = 'zh-CN';
    else if (rawLang.startsWith('en')) rawLang = 'en';
    else if (rawLang.startsWith('ko')) rawLang = 'ko';
    else if (rawLang.startsWith('pt')) rawLang = 'pt';
    else if (rawLang.startsWith('vi')) rawLang = 'vi';
    else if (rawLang.startsWith('tl') || rawLang.startsWith('fil')) rawLang = 'tl';
    const currentLang = CAMERA_I18N[rawLang] ? rawLang : 'ja';

    function t(key, vars = {}) {
      const dict = CAMERA_I18N[currentLang] || CAMERA_I18N['ja'];
      let str = dict[key] || CAMERA_I18N['ja'][key] || key;
      Object.keys(vars).forEach(k => {
        str = str.replace(new RegExp(`\\{${k}\\}`, 'g'), vars[k]);
      });
      return str;
    }

    // UI初期化（多言語反映）
    const titleEl = document.getElementById('scanner-title');
    if (titleEl) titleEl.textContent = t('title');
    document.title = `${t('title')} (Camera Scanner)`;

    const switchCamText = document.getElementById('btn-switch-cam-text');
    if (switchCamText) switchCamText.textContent = t('btnSwitchCam');

    const cancelText = document.getElementById('btn-cancel-text');
    if (cancelText) cancelText.textContent = t('btnClose');

    const returnHostText = document.getElementById('btn-return-host-text');
    if (returnHostText) returnHostText.textContent = t('btnReturn');

    const finishCheckoutText = document.getElementById('btn-finish-checkout-text');
    if (finishCheckoutText) finishCheckoutText.textContent = t('btnFinishSingle');

    const copyText = document.getElementById('btn-copy-text');
    if (copyText) copyText.textContent = t('btnCopy');

    const lblScanResult = document.getElementById('lbl-scan-result');
    if (lblScanResult) lblScanResult.textContent = t('scanResult');

    // バッジ & UI
    const badgeEl = document.getElementById('target-badge');
    const statusArea = document.getElementById('status-area');
    if (statusArea) statusArea.textContent = t('ready');
    const scannerBox = document.getElementById('scanner-box');
    const successOverlay = document.getElementById('success-overlay');
    const successCodeDisplay = document.getElementById('success-code-display');
    const btnFinishCheckout = document.getElementById('btn-finish-checkout');

    function updateBadge(label, isStepBook = false) {
      badgeEl.textContent = label;
      if (isStepBook) {
        badgeEl.classList.add('step-book');
      } else {
        badgeEl.classList.remove('step-book');
      }
    }
    updateBadge(currentTargetLabel);

    // 効果音 (Web Audio API)
    let audioCtx = null;
    function playBeep(freq = 1760, duration = 0.12) {
      try {
        if (!audioCtx) {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioCtxClass();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let html5QrCode = null;
    let isScanning = false;
    let isCooldown = false;
    let currentFacingMode = "environment";
    let availableCameras = [];
    let currentCameraIndex = 0;

    function setStatus(type, msg) {
      statusArea.className = type;
      statusArea.textContent = msg;
    }

    async function initCameras() {
      try {
        if (typeof Html5Qrcode !== 'undefined' && Html5Qrcode.getCameras) {
          availableCameras = await Html5Qrcode.getCameras();
          console.log('[Scanner] Available cameras:', availableCameras);
        }
      } catch (e) {
        console.warn('[Scanner] getCameras error:', e);
      }
    }

    async function startCamera() {
      if (typeof Html5Qrcode === 'undefined') {
        setStatus('error', t('errLib'));
        return;
      }

      if (html5QrCode) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
      }

      html5QrCode = new Html5Qrcode("reader-preview");
      const config = {
        fps: 12,
        qrbox: { width: 280, height: 150 },
        aspectRatio: 1.333333
      };

      // 利用可能なカメラデバイスが存在する場合は deviceId を使用、無ければ facingMode を使用
      let cameraConfig = { facingMode: currentFacingMode };
      if (availableCameras && availableCameras.length > 0) {
        const cam = availableCameras[currentCameraIndex % availableCameras.length];
        if (cam && cam.id) {
          cameraConfig = cam.id;
        }
      }

      try {
        await html5QrCode.start(
          cameraConfig,
          config,
          onCodeScanned,
          () => {}
        );
        isScanning = true;
        isCooldown = false;
        setStatus('ready', t('guide', { label: currentTargetLabel }));
        if (!availableCameras || availableCameras.length <= 1) {
          initCameras();
        }
      } catch (err) {
        console.error("Camera start error with config:", cameraConfig, err);
        // フォールバック: 反対のモードまたは facingMode で再試行
        try {
          await html5QrCode.start(
            { facingMode: (currentFacingMode === "environment" ? "user" : "environment") },
            config,
            onCodeScanned,
            () => {}
          );
          currentFacingMode = (currentFacingMode === "environment" ? "user" : "environment");
          isScanning = true;
          isCooldown = false;
          setStatus('ready', t('guide', { label: currentTargetLabel }));
        } catch (fallbackErr) {
          console.error("Camera fallback start error:", fallbackErr);
          setStatus('error', t('errStart'));
        }
      }
    }

    function cleanBookBarcode(raw) {
      if (!raw) return '';
      let c = String(raw).trim();
      c = c.replace(/^\*+|\*+$/g, '');
      const nw7Match = c.match(/^[A-Da-d](\d{4,12})[A-Da-d]$/);
      if (nw7Match) {
        c = nw7Match[1];
      }
      c = c.replace(/\s+/g, '');
      return c;
    }

    function onCodeScanned(decodedText) {
      if (!isScanning || isCooldown) return;
      const rawCode = decodedText.trim();
      if (!rawCode) return;

      let code = rawCode.replace(/[-\s]/g, '').toUpperCase();

      if (currentTargetInputId === 'input-book-id' || currentTargetInputId === 'input-return-book-id' || currentTargetInputId === 'reg-book-id' || currentTargetInputId === 'input-discard-book-id') {
        code = cleanBookBarcode(rawCode);
      }

      if (currentTargetInputId === 'reg-isbn') {
        if (/^192\d{10}$/.test(code)) {
          isCooldown = true;
          playBeep(440, 0.25);
          setStatus('error', t('errWrongCode192'));
          setTimeout(() => {
            isCooldown = false;
            setStatus('ready', t('guide', { label: currentTargetLabel }));
          }, 1400);
          return;
        }
      }

      isScanning = false;
      isCooldown = true;

      playBeep(1760, 0.12);
      scannerBox.classList.add('success-flash');
      successCodeDisplay.textContent = code;
      successOverlay.classList.add('visible');
      setStatus('success', t('success', { code: code }));

      let messageSent = false;
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'LIBRARY_SCAN_RESULT',
            code: code,
            target: currentTargetInputId
          }, '*');
          messageSent = true;
          console.log('[Scanner] Sent to opener:', code, currentTargetInputId);
        } catch (e) {
          console.warn('[Scanner] postMessage error:', e);
        }
      }

      if (!messageSent) {
        document.getElementById('manual-result-card').style.display = 'block';
        document.getElementById('manual-code').textContent = code;
        document.getElementById('btn-copy').onclick = () => {
          navigator.clipboard.writeText(code).then(() => alert(t('copied') + code));
        };
      }

      if (scanMode === 'single' && messageSent) {
        const btnReturn = document.getElementById('btn-return-host');
        if (btnReturn) btnReturn.style.display = 'flex';
        setTimeout(() => window.close(), 550);
      } else if (scanMode === 'checkout-flow' && messageSent) {
        setTimeout(() => {
          scannerBox.classList.remove('success-flash');
          successOverlay.classList.remove('visible');
          isCooldown = false;
          isScanning = true;
        }, 1200);
      } else {
        setTimeout(() => {
          scannerBox.classList.remove('success-flash');
          successOverlay.classList.remove('visible');
          isCooldown = false;
          isScanning = true;
          setStatus('ready', t('guide', { label: currentTargetLabel }));
        }, 1800);
      }
    }

    window.addEventListener('message', (event) => {
      if (!event.data) return;
      const data = event.data;

      if (data.type === 'UPDATE_SCANNER_STEP') {
        const step = data.step;
        const remaining = data.remaining;
        const target = data.target || 'input-book-id';

        currentTargetInputId = target;

        if (step === 'BOOK_CHECKOUT') {
          updateBadge(t('badgeRemaining', { count: remaining }), true);
          
          if (remaining > 1) {
            setStatus('step', t('stepRemaining', { count: remaining }));
            btnFinishCheckout.style.display = 'none';
          } else if (remaining === 1) {
            setStatus('step', t('stepOneDone', { count: 1 }));
            btnFinishCheckout.style.display = 'flex';
          }
        } else if (step === 'COMPLETE') {
          playBeep(2200, 0.2);
          btnFinishCheckout.style.display = 'none';
          setStatus('success', t('checkoutDone'));
          setTimeout(() => {
            window.close();
          }, 800);
        }
      } else if (data.type === 'SCANNER_ERROR') {
        setStatus('error', data.message || 'Error occurred');
        btnFinishCheckout.style.display = 'none';
      }
    });

    btnFinishCheckout.addEventListener('click', () => {
      playBeep(1960, 0.15);
      setStatus('success', t('checkoutDone'));
      btnFinishCheckout.disabled = true;

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'FINISH_CHECKOUT_SESSION'
          }, '*');
        } catch (e) {}
      }

      setTimeout(() => {
        window.close();
      }, 500);
    });

    // カメラ切替（デバイス順次切替 ＆ facingMode切替のハイブリッド）
    document.getElementById('btn-switch-cam').addEventListener('click', async () => {
      if (!availableCameras || availableCameras.length <= 1) {
        await initCameras();
      }
      if (availableCameras && availableCameras.length > 1) {
        currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
      } else {
        currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      }
      await startCamera();
    });

    document.getElementById('btn-return-host')?.addEventListener('click', () => {
      window.close();
    });

    document.getElementById('btn-cancel').addEventListener('click', () => {
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'CANCEL_SCANNER',
            mode: scanMode,
            target: currentTargetInputId
          }, '*');
        } catch (e) {}
      }
      window.close();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      setStatus('ready', t('ready'));
      await initCameras();
      await startCamera();
    });
  </script>
</html>
